<text x="482.5" y="1659" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">15</text>
<text x="170" y="2200" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">TOP/WEST</text>
<text x="1120" y="2200" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">BOTTOM/EAST</text>
<line x1="80" y1="2330" x2="1520" y2="2330" stroke="#c9c5b9" stroke-width="3"/>
<text x="80" y="2380" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Exactly 15 risers in profile and 15 arcs in plan. Numeral 1 at</text>
<text x="80" y="2434" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">EAST/bottom;15 reaches the gate toward WEST/Israel court. Profile</text>
<text x="80" y="2488" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">run/rise exaggerated for readability, not metric.</text>
<text x="80" y="2558" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Middot 2:5 describes the semicircular ascent from Women’s Court</text>
<text x="80" y="2612" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">toward Israelites’ Court. Nicanor gate is a declared model</text>
<text x="80" y="2666" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">identification; KJV Beautiful Gate is not certainly identified</text>
<text x="80" y="2720" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">with it.</text>
<text x="80" y="2790" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Women’s Court was not women-only. Surface details, gallery timing</text>
<text x="80" y="2844" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">and complete superstructure remain reconstructed from later</text>
<text x="80" y="2898" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">testimony.</text>
</svg>