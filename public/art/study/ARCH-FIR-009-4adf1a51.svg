<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" role="img"><title>First Temple side chambers: widths and supported beam ends</title><rect width="1600" height="2200" fill="#fbf9f2"/>
<text x="80" y="100" font-family="Arial,sans-serif" font-size="56" fill="#243c38">First Temple: side chambers</text>
<text x="80" y="175" font-family="Arial,sans-serif" font-size="40" fill="#243c38">1 Kings 6:6,10 KJV | teaching section, cubits</text>
<text x="80" y="245" font-family="Arial,sans-serif" font-size="40" fill="#243c38">Exact room-width and storey-height ratios; joint enlarged below.</text>
<rect x="220" y="1150" width="300" height="300" fill="#e7dcc6" stroke="#243c38" stroke-width="4"/>
<text x="290" y="1330" font-family="Arial,sans-serif" font-size="44" fill="#243c38">5 wide</text>
<line x1="120" y1="1150" x2="120" y2="1450" stroke="#243c38" stroke-width="4"/>
<line x1="105" y1="1150" x2="135" y2="1150" stroke="#243c38" stroke-width="4"/>
<line x1="105" y1="1450" x2="135" y2="1450" stroke="#243c38" stroke-width="4"/>
<text x="72" y="1320" font-family="Arial,sans-serif" font-size="40" fill="#243c38">5</text>
<rect x="220" y="850" width="360" height="300" fill="#e7dcc6" stroke="#243c38" stroke-width="4"/>
<text x="290" y="1030" font-family="Arial,sans-serif" font-size="44" fill="#243c38">6 wide</text>
<line x1="120" y1="850" x2="120" y2="1150" stroke="#243c38" stroke-width="4"/>
<line x1="105" y1="850" x2="135" y2="850" stroke="#243c38" stroke-width="4"/>
<line x1="105" y1="1150" x2="135" y2="1150" stroke="#243c38" stroke-width="4"/>
<text x="72" y="1020" font-family="Arial,sans-serif" font-size="40" fill="#243c38">5</text>
<rect x="220" y="550" width="420" height="300" fill="#e7dcc6" stroke="#243c38" stroke-width="4"/>
<text x="290" y="730" font-family="Arial,sans-serif" font-size="44" fill="#243c38">7 wide</text>
<line x1="120" y1="550" x2="120" y2="850" stroke="#243c38" stroke-width="4"/>
<line x1="105" y1="550" x2="135" y2="550" stroke="#243c38" stroke-width="4"/>
<line x1="105" y1="850" x2="135" y2="850" stroke="#243c38" stroke-width="4"/>
<text x="72" y="720" font-family="Arial,sans-serif" font-size="40" fill="#243c38">5</text>
<path d="M 520,1450 L 1040,1450 L 1040,500 L 700,500 L 700,550 L 640,550 L 640,850 L 580,850 L 580,1150 L 520,1150 Z" fill="#b5b5ac" stroke="#243c38" stroke-width="4"/>
<rect x="220" y="1132" width="346" height="18" fill="#886541" stroke="#243c38" stroke-width="4"/>
<rect x="220" y="832" width="406" height="18" fill="#886541" stroke="#243c38" stroke-width="4"/>
<rect x="220" y="532" width="466" height="18" fill="#886541" stroke="#243c38" stroke-width="4"/>
<text x="1100" y="750" font-family="Arial,sans-serif" font-size="40" fill="#243c38">House</text>
<text x="1100" y="810" font-family="Arial,sans-serif" font-size="40" fill="#243c38">wall</text>
<line x1="1085" y1="780" x2="1010" y2="780" stroke="#243c38" stroke-width="4"/>
<text x="1080" y="1090" font-family="Arial,sans-serif" font-size="40" fill="#243c38">Outer face</text>
<text x="1080" y="1150" font-family="Arial,sans-serif" font-size="40" fill="#243c38">of annex</text>
<text x="1080" y="1210" font-family="Arial,sans-serif" font-size="40" fill="#243c38">stays vertical</text>
<line x1="1080" y1="1240" x2="1080" y2="1480" stroke="#243c38" stroke-width="4"/>
<line x1="1080" y1="1480" x2="220" y2="1480" stroke="#243c38" stroke-width="4"/>
<line x1="220" y1="1480" x2="220" y2="1450" stroke="#243c38" stroke-width="4"/>
<text x="80" y="1570" font-family="Arial,sans-serif" font-size="42" fill="#243c38">Joint principle (enlarged, not a measured engineering detail)</text>
<rect x="240" y="1650" width="500" height="35" fill="#886541" stroke="#243c38" stroke-width="4"/>
<rect x="580" y="1685" width="190" height="90" fill="#b5b5ac" stroke="#243c38" stroke-width="4"/>
<rect x="770" y="1600" width="120" height="175" fill="#b5b5ac" stroke="#243c38" stroke-width="4"/>
<line x1="740" y1="1620" x2="770" y2="1620" stroke="#754f80" stroke-width="5"/>
<text x="950" y="1650" font-family="Arial,sans-serif" font-size="40" fill="#243c38">Beam ends before</text>
<text x="950" y="1710" font-family="Arial,sans-serif" font-size="40" fill="#243c38">the upper wall face.</text>
<text x="240" y="1840" font-family="Arial,sans-serif" font-size="40" fill="#243c38">Cedar rests on the rebate; no beam socket is drawn in the wall.</text>
<text x="80" y="1950" font-family="Arial,sans-serif" font-size="40" fill="#243c38">Five, six and seven are the successive internal widths.</text>
<text x="80" y="2010" font-family="Arial,sans-serif" font-size="40" fill="#243c38">Each storey is represented as five high; floor thickness is schematic.</text>
<text x="80" y="2070" font-family="Arial,sans-serif" font-size="40" fill="#243c38">Roof, wall thickness and joinery are reconstructed, not excavated.</text>
<text x="80" y="2130" font-family="Arial,sans-serif" font-size="40" fill="#243c38">No fixed modern cubit conversion or structural design is certified.</text>
</svg>