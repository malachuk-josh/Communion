<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2880" viewBox="0 0 1600 2880" role="img"><title>First Temple: literal KJV120-high porch</title><rect width="1600" height="2880" fill="#fbf9f2"/>
<text x="80" y="90" fill="#243c38" font-family="Arial,sans-serif" font-size="52" text-anchor="start">First Temple: literal KJV 120-high porch</text>
<text x="80" y="160" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">2 Chronicles 3:4 KJV versus 1 Kings 6:2-3. Textual study, not</text>
<text x="80" y="214" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">excavated architecture.</text>
<rect x="260" y="1440" width="720" height="360" fill="#e6d7b8" stroke="#243c38" stroke-width="4"/>
<rect x="980" y="360" width="120" height="1440" fill="#d9bb6c" stroke="#a26728" stroke-width="4" stroke-dasharray="12 9"/>
<line x1="260" y1="1900" x2="980" y2="1900" stroke="#60706b" stroke-width="3"/>
<line x1="260" y1="1888" x2="260" y2="1912" stroke="#60706b" stroke-width="3"/>
<line x1="980" y1="1888" x2="980" y2="1912" stroke="#60706b" stroke-width="3"/>
<text x="620.0" y="1877" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">60</text>
<line x1="980" y1="1980" x2="1100" y2="1980" stroke="#60706b" stroke-width="3"/>
<line x1="980" y1="1968" x2="980" y2="1992" stroke="#60706b" stroke-width="3"/>
<line x1="1100" y1="1968" x2="1100" y2="1992" stroke="#60706b" stroke-width="3"/>
<text x="1040.0" y="1957" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">10</text>
<line x1="1180" y1="360" x2="1180" y2="1800" stroke="#60706b" stroke-width="3"/>
<line x1="1168" y1="360" x2="1192" y2="360" stroke="#60706b" stroke-width="3"/>
<line x1="1168" y1="1800" x2="1192" y2="1800" stroke="#60706b" stroke-width="3"/>
<text x="1204" y="1080.0" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">120</text>
<line x1="160" y1="1440" x2="160" y2="1800" stroke="#60706b" stroke-width="3"/>
<line x1="148" y1="1440" x2="172" y2="1440" stroke="#60706b" stroke-width="3"/>
<line x1="148" y1="1800" x2="172" y2="1800" stroke="#60706b" stroke-width="3"/>
<text x="184" y="1620.0" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">30</text>
<text x="540" y="1540" fill="#243c38" font-family="Arial,sans-serif" font-size="48" text-anchor="middle">HOUSE</text>
<text x="1040" y="315" fill="#243c38" font-family="Arial,sans-serif" font-size="48" text-anchor="middle">PORCH</text>
<text x="80" y="1350" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">WEST</text>
<text x="1280" y="1350" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">EAST</text>
<text x="220" y="620" fill="#243c38" font-family="Arial,sans-serif" font-size="48" text-anchor="start">Height 120:30 =4:1</text>
<text x="220" y="690" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">One scale for height AND length</text>
<line x1="80" y1="2100" x2="1520" y2="2100" stroke="#c9c5b9" stroke-width="3"/>
<text x="80" y="2150" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">House 60 long×20 broad×30 high; porch projects 10 and is 20</text>
<text x="80" y="2204" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">across. The measured rectangles share the SAME scale in both</text>
<text x="80" y="2258" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">axes.</text>
<text x="80" y="2328" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">KJV Chronicles porch height 120 is four times house 30. Kings</text>
<text x="80" y="2382" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">gives no separate porch height. Tower structure/engineering are</text>
<text x="80" y="2436" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">not established.</text>
<text x="80" y="2506" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Some Greek Septuagint(LXX) witnesses and the ancient Syriac read</text>
<text x="80" y="2560" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">20, as discussed by the UBS Chronicles handbook. This sheet</text>
<text x="80" y="2614" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">retains KJV 120; no exact codex attribution is asserted here.</text>
<text x="80" y="2684" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Kings pillar shafts 18 versus Chronicles 35, and other textual</text>
<text x="80" y="2738" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">differences, must not be averaged. No fixed modern cubit</text>
<text x="80" y="2792" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">conversion.</text>
</svg>