<text x="760" y="920" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Each storey 5 high</text>
<text x="760" y="985" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Outer face vertical</text>
<text x="760" y="1050" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Beams rest on ledges</text>
<line x1="80" y1="1200" x2="1520" y2="1200" stroke="#c9c5b9" stroke-width="3"/>
<text x="80" y="1250" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">House plan 60 x 20; oracle 20 x 20 x 20. Main house 30 high per 1</text>
<text x="80" y="1304" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Kings 6:2. North, south and west ground-floor chamber bands are</text>
<text x="80" y="1358" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">schematic 5-wide zones; upper 6/7 widths appear in the inset.</text>
<text x="80" y="1428" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Inventory: 10 lampstands, 5 per side; 1 gold table (Kings 7:48).</text>
<text x="80" y="1482" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">One gold incense altar; symbols/spacing schematic.</text>
<text x="80" y="1552" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Kings 6:31-32 specifies olivewood entering doors. Chronicles</text>
<text x="80" y="1606" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">describes both a veil (3:14) and doors (4:22). Material details and</text>
<text x="80" y="1660" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">source differences remain explicit.</text>
<text x="80" y="1730" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Porch plan 20 across×10 projecting follows Kings 6:3; Kings gives</text>
<text x="80" y="1784" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">no separate porch height. Chronicles 3:4 KJV 120 is shown in the</text>
<text x="80" y="1838" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">dedicated variant study.</text>
</svg>