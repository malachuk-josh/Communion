<text x="1220" y="1270" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">One board</text>
<text x="1220" y="1330" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">2 tenons</text>
<text x="1220" y="1390" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">2 sockets</text>
<text x="160" y="1960" fill="#243c38" font-family="Arial,sans-serif" font-size="48" text-anchor="start">Side-extension comparison at one scale</text>
<rect x="260" y="2050" width="1200" height="95" fill="#bba88c" stroke="#243c38" stroke-width="4"/>
<rect x="300" y="2050" width="1120" height="95" fill="#eae1cb" stroke="#243c38" stroke-width="4"/>
<line x1="260" y1="2240" x2="300" y2="2240" stroke="#60706b" stroke-width="3"/>
<line x1="260" y1="2228" x2="260" y2="2252" stroke="#60706b" stroke-width="3"/>
<line x1="300" y1="2228" x2="300" y2="2252" stroke="#60706b" stroke-width="3"/>
<text x="280.0" y="2217" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">1</text>
<line x1="1420" y1="2240" x2="1460" y2="2240" stroke="#60706b" stroke-width="3"/>
<line x1="1420" y1="2228" x2="1420" y2="2252" stroke="#60706b" stroke-width="3"/>
<line x1="1460" y1="2228" x2="1460" y2="2252" stroke="#60706b" stroke-width="3"/>
<text x="1440.0" y="2217" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">1</text>
<text x="860" y="2115" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">28-cubit linen</text>
<text x="860" y="2330" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">30-cubit goat hair =1+28+1</text>
<line x1="80" y1="2450" x2="1520" y2="2450" stroke="#c9c5b9" stroke-width="3"/>
<text x="80" y="2500" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Inside→outside: embroidered linen; goat hair; red-dyed rams’</text>
<text x="80" y="2554" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">skins; outer KJV badgers’ skins. Outer zoology, color, seams and</text>
<text x="80" y="2608" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">dimensions are uncertain.</text>
<text x="80" y="2678" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Linen 10 curtains, each 28×4, coupled 5+5. Goat hair 11 curtains,</text>
<text x="80" y="2732" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">each 30×4, coupled 5+6; sixth curtain doubled at front.</text>
<text x="80" y="2802" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Length comparison shows 1 cubit of additional goat hair beyond</text>
<text x="80" y="2856" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">each linen edge (Exodus 26:13). The remaining half-curtain hangs</text>
<text x="80" y="2910" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">at rear. Flat layouts do not claim a finished roof profile.</text>
<text x="80" y="2980" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Boards 10 high×1.5 wide;2 tenons and 2 silver sockets each.</text>
<text x="80" y="3034" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Allocation 20 north+20 south+6 west+2 corner boards=48;96 board</text>
<text x="80" y="3088" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">sockets plus 4 veil sockets=100 silver sockets.</text>
<text x="80" y="3158" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Doorway 5 brass sockets are distinct. Skin-layer dimensions and</text>
<text x="80" y="3212" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">corner-board joinery are not prescribed.</text>
</svg>