<line x1="160" y1="298" x2="160" y2="322" stroke="#60706b" stroke-width="3"/>
<line x1="960" y1="298" x2="960" y2="322" stroke="#60706b" stroke-width="3"/>
<text x="560.0" y="287" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">40 total width</text>
<line x1="1100" y1="340" x2="1100" y2="900" stroke="#60706b" stroke-width="3"/>
<line x1="1088" y1="340" x2="1112" y2="340" stroke="#60706b" stroke-width="3"/>
