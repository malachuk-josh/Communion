<line x1="1320" y1="1120" x2="1410" y2="1120" stroke="#60706b" stroke-width="3"/>
<line x1="1320" y1="1108" x2="1320" y2="1132" stroke="#60706b" stroke-width="3"/>
<line x1="1410" y1="1108" x2="1410" y2="1132" stroke="#60706b" stroke-width="3"/>
<text x="1365.0" y="1097" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">1.5</text>
<rect x="1330" y="940" width="20" height="35" fill="#d7b75e" stroke="#243c38" stroke-width="4"/>
