<text x="160" y="1838" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">11 panels, each 4 wide; groups 5+6</text>
<rect x="1320" y="340" width="90" height="600" fill="#d7b75e" stroke="#243c38" stroke-width="4"/>
<line x1="1460" y1="340" x2="1460" y2="940" stroke="#60706b" stroke-width="3"/>
