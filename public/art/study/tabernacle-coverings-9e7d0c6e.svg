<text x="1124" y="620.0" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">28</text>
<text x="160" y="968" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">10 panels, each 4 wide; groups 5+5</text>
<text x="160" y="1070" fill="#243c38" font-family="Arial,sans-serif" font-size="48" text-anchor="start">GOAT HAIR</text>
<rect x="160" y="1170" width="880" height="600" fill="#bba88c" stroke="#243c38" stroke-width="4"/>
<line x1="240" y1="1170" x2="240" y2="1770" stroke="#8f836a" stroke-width="2"/>
