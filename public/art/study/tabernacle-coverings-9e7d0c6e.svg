<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3300" viewBox="0 0 1600 3300" role="img"><title>Tabernacle: curtains and upright boards</title><rect width="1600" height="3300" fill="#fbf9f2"/>
<text x="80" y="90" fill="#243c38" font-family="Arial,sans-serif" font-size="52" text-anchor="start">Tabernacle: curtains and upright boards</text>
<text x="80" y="160" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Exodus 26;36 KJV. Curtains laid flat BEFORE folding/assembly.</text>
<text x="160" y="240" fill="#243c38" font-family="Arial,sans-serif" font-size="48" text-anchor="start">LINEN</text>
