<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1940" viewBox="0 0 1600 1940" role="img"><title>Tabernacle: court and westward approach</title><rect width="1600" height="1940" fill="#fbf9f2"/>
<text x="80" y="90" fill="#243c38" font-family="Arial,sans-serif" font-size="52" text-anchor="start">Tabernacle: court and westward approach</text>
<text x="80" y="160" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Exodus 25-30;38;40 KJV. Cubits; exact court, schematic furniture.</text>
<rect x="200" y="390" width="1100" height="550" fill="#f6efda" stroke="#243c38" stroke-width="4"/>
<line x1="200" y1="315" x2="1300" y2="315" stroke="#60706b" stroke-width="3"/>
<line x1="200" y1="303" x2="200" y2="327" stroke="#60706b" stroke-width="3"/>
<line x1="1300" y1="303" x2="1300" y2="327" stroke="#60706b" stroke-width="3"/>
<text x="750.0" y="292" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">100</text>
<line x1="1390" y1="390" x2="1390" y2="940" stroke="#60706b" stroke-width="3"/>
<line x1="1378" y1="390" x2="1402" y2="390" stroke="#60706b" stroke-width="3"/>
<line x1="1378" y1="940" x2="1402" y2="940" stroke="#60706b" stroke-width="3"/>
<text x="1414" y="665.0" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">50</text>
<text x="750" y="365" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">NORTH</text>
<text x="750" y="1010" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">SOUTH</text>
<text x="80" y="680" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">WEST</text>
<text x="1370" y="1000" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">EAST</text>
<rect x="310" y="610" width="330" height="110" fill="#e9cf8a" stroke="#a26728" stroke-width="4" stroke-dasharray="12 9"/>
<line x1="420" y1="610" x2="420" y2="720" stroke="#754f80" stroke-width="6"/>
<rect x="345" y="652" width="28" height="17" fill="#d7b75e" stroke="#243c38" stroke-width="4"/>
<rect x="535" y="628" width="32" height="18" fill="#d7b75e" stroke="#243c38" stroke-width="4"/>
<circle cx="550" cy="700" r="10" fill="#d7b75e" stroke="#243c38" stroke-width="3"/>
<rect x="442" y="655" width="16" height="16" fill="#d7b75e" stroke="#243c38" stroke-width="4"/>
<circle cx="770" cy="665" r="20" fill="#b88652" stroke="#243c38" stroke-width="3"/>
<rect x="900" y="638" width="55" height="55" fill="#b88652" stroke="#243c38" stroke-width="4"/>
<line x1="1300" y1="555" x2="1300" y2="775" stroke="#754f80" stroke-width="12"/>
<text x="1090" y="850" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Gate 20</text>
<text x="320" y="520" fill="#a26728" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Tent 30×10</text>
<line x1="410" y1="535" x2="410" y2="600" stroke="#a26728" stroke-width="4"/>
<text x="420" y="1090" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">Approach EAST → WEST</text>
<line x1="1120" y1="1030" x2="850" y2="1030" stroke="#243c38" stroke-width="4"/>
<line x1="850" y1="1030" x2="880" y2="1015" stroke="#243c38" stroke-width="4"/>
<line x1="850" y1="1030" x2="880" y2="1045" stroke="#243c38" stroke-width="4"/>
<rect x="120" y="1170" width="30" height="25" fill="#d7b75e" stroke="#243c38" stroke-width="4"/>
<text x="170" y="1200" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Gold: furniture</text>
<circle cx="700" cy="1188" r="13" fill="#b88652" stroke="#243c38" stroke-width="3"/>
<text x="745" y="1200" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Bronze: laver / altar</text>
<line x1="120" y1="1260" x2="150" y2="1260" stroke="#754f80" stroke-width="8"/>
<text x="170" y="1275" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Purple: curtain / entrance</text>
<line x1="80" y1="1320" x2="1520" y2="1320" stroke="#c9c5b9" stroke-width="3"/>
<text x="80" y="1370" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Court 100×50; hangings 5 high; east entrance 20 with 15-cubit</text>
<text x="80" y="1424" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">hangings on each side.</text>
<text x="80" y="1494" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Conventional tent 30×10 and west 10/east 20 division are</text>
<text x="80" y="1548" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">deductions, not an independently surveyed footprint.</text>
<text x="80" y="1618" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Schematic symbols: Ark west; incense altar before veil; table</text>
<text x="80" y="1672" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">north; seven-lamp stand south; laver between tent and burnt</text>
<text x="80" y="1726" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">altar. Exact offsets and symbol sizes are not prescribed.</text>
<text x="80" y="1796" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Court gate 4 pillars; tent door 5; inner veil 4. Corner/post</text>
<text x="80" y="1850" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">spacing and complete roof construction remain interpretive.</text>
</svg>