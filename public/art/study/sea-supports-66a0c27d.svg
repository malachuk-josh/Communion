<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2120" viewBox="0 0 1600 2120" role="img"><title>Molten Sea:12 supports beneath one basin</title><rect width="1600" height="2120" fill="#fbf9f2"/>
<text x="80" y="90" fill="#243c38" font-family="Arial,sans-serif" font-size="52" text-anchor="start">Molten Sea:12 supports beneath one basin</text>
<text x="80" y="160" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">1 Kings 7:23-26 and 2 Chronicles 4:2-5 KJV. Cardinal arrangement</text>
<text x="80" y="214" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">schematic.</text>
<circle cx="800" cy="660" r="300" fill="#f1e7d6" stroke="#243c38" stroke-width="3"/>
<rect x="718" y="430" width="34" height="100" fill="#bd8b51" stroke="#243c38" stroke-width="4"/>
<circle cx="735" cy="410" r="15" fill="#89623d" stroke="#243c38" stroke-width="3"/>
<rect x="718" y="790" width="34" height="100" fill="#bd8b51" stroke="#243c38" stroke-width="4"/>
<circle cx="735" cy="910" r="15" fill="#89623d" stroke="#243c38" stroke-width="3"/>
<rect x="570" y="578" width="100" height="34" fill="#bd8b51" stroke="#243c38" stroke-width="4"/>
<circle cx="550" cy="595" r="15" fill="#89623d" stroke="#243c38" stroke-width="3"/>
<rect x="930" y="578" width="100" height="34" fill="#bd8b51" stroke="#243c38" stroke-width="4"/>
<circle cx="1050" cy="595" r="15" fill="#89623d" stroke="#243c38" stroke-width="3"/>
<rect x="783" y="430" width="34" height="100" fill="#bd8b51" stroke="#243c38" stroke-width="4"/>
<circle cx="800" cy="410" r="15" fill="#89623d" stroke="#243c38" stroke-width="3"/>
<rect x="783" y="790" width="34" height="100" fill="#bd8b51" stroke="#243c38" stroke-width="4"/>
<circle cx="800" cy="910" r="15" fill="#89623d" stroke="#243c38" stroke-width="3"/>
<rect x="570" y="643" width="100" height="34" fill="#bd8b51" stroke="#243c38" stroke-width="4"/>
<circle cx="550" cy="660" r="15" fill="#89623d" stroke="#243c38" stroke-width="3"/>
<rect x="930" y="643" width="100" height="34" fill="#bd8b51" stroke="#243c38" stroke-width="4"/>
<circle cx="1050" cy="660" r="15" fill="#89623d" stroke="#243c38" stroke-width="3"/>
<rect x="848" y="430" width="34" height="100" fill="#bd8b51" stroke="#243c38" stroke-width="4"/>
<circle cx="865" cy="410" r="15" fill="#89623d" stroke="#243c38" stroke-width="3"/>
<rect x="848" y="790" width="34" height="100" fill="#bd8b51" stroke="#243c38" stroke-width="4"/>
<circle cx="865" cy="910" r="15" fill="#89623d" stroke="#243c38" stroke-width="3"/>
<rect x="570" y="708" width="100" height="34" fill="#bd8b51" stroke="#243c38" stroke-width="4"/>
<circle cx="550" cy="725" r="15" fill="#89623d" stroke="#243c38" stroke-width="3"/>
<rect x="930" y="708" width="100" height="34" fill="#bd8b51" stroke="#243c38" stroke-width="4"/>
<circle cx="1050" cy="725" r="15" fill="#89623d" stroke="#243c38" stroke-width="3"/>
<text x="800" y="300" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">NORTH 3</text>
<text x="800" y="1030" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">SOUTH 3</text>
<text x="180" y="670" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">WEST 3</text>
<text x="1190" y="670" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">EAST 3</text>
<text x="800" y="640" fill="#243c38" font-family="Arial,sans-serif" font-size="44" text-anchor="middle">ONE BASIN</text>
<text x="800" y="700" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">Diameter 10</text>
<text x="120" y="1140" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Transparent plan: all 12 oxen are UNDER the basin.</text>
<line x1="80" y1="1220" x2="1520" y2="1220" stroke="#c9c5b9" stroke-width="3"/>
<text x="80" y="1270" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Three oxen face each direction; hindquarters inward. Twelve body</text>
<text x="80" y="1324" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">symbols and twelve round heads are countable beneath the circular</text>
<text x="80" y="1378" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">footprint; no animal above a rim.</text>
<text x="80" y="1448" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">KJV measurements: diameter 10, height 5, circumference 30 cubits;</text>
<text x="80" y="1502" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">thickness 1 handbreadth; brim like a lily cup. Retain textual</text>
<text x="80" y="1556" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">numbers without claiming modern measurement precision.</text>
<text x="80" y="1626" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Kings 7:24:2 rows of knops. Chronicles 4:3:2 rows of oxen</text>
<text x="80" y="1680" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">likenesses. These are separate descriptions, not one merged row.</text>
<text x="80" y="1750" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Capacity Kings 2000 baths;Chronicles 3000. Do not certify modern</text>
<text x="80" y="1804" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">volume or silently harmonize. Bowl profile, support height and</text>
<text x="80" y="1858" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">sculpture are interpretive.</text>
<text x="80" y="1928" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Perspective pictures may hide far supports; hidden counts cannot</text>
<text x="80" y="1982" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">be certified there. This transparent count-plan supplies the full</text>
<text x="80" y="2036" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">arrangement.</text>
</svg>