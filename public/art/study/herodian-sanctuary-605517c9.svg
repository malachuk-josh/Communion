<line x1="1168" y1="1600" x2="1192" y2="1600" stroke="#60706b" stroke-width="3"/>
<line x1="1168" y1="2200" x2="1192" y2="2200" stroke="#60706b" stroke-width="3"/>
<text x="1204" y="1900.0" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">100</text>
<text x="80" y="2340" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Open portal 40 high×20 wide: Middot 3:7</text>
<line x1="80" y1="2420" x2="1520" y2="2420" stroke="#c9c5b9" stroke-width="3"/>
<text x="80" y="2470" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Middot 4:7 length 100 = west wall 5+cell 6+wall 6+inner</text>
<text x="80" y="2524" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">20+partition 1+hall 40+wall 6+porch 11+east wall 5. Rear breadth</text>
<text x="80" y="2578" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">70; porch shoulders extend 15 north and 15 south to 100.</text>
<text x="80" y="2648" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Plan/elevation follow the selected later Middot account, not a</text>
<text x="80" y="2702" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">surviving surveyed building. West cell band is included; cell</text>
<text x="80" y="2756" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">subdivisions and furniture icons are schematic. Middot 4:3</text>
<text x="80" y="2810" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">records west cells across multiple storeys; this is not a</text>
<text x="80" y="2864" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">complete cell-count plan.</text>
<text x="80" y="2934" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Inner height 40 and upper chamber 40 follow Middot 4:6;</text>
<text x="80" y="2988" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">structural/top layers complete 100. Josephus War 5.5 gives inner</text>
<text x="80" y="3042" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">height 60 and rear width 60 instead.</text>
<text x="80" y="3112" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Two curtains 1 cubit apart choose Yoma 5:1 majority account;</text>
<text x="80" y="3166" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Rabbi Yosei records a one-curtain alternative. Josephus describes</text>
<text x="80" y="3220" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">a curtain without this geometry.</text>
<text x="80" y="3290" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Inner chamber EMPTY: no Ark/monumental cherubim. One</text>
<text x="80" y="3344" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">table/menorah/incense altar; form/placement reconstructed.</text>
<text x="80" y="3398" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Josephus outer portal 70×25 differs from Middot 40×20.</text>
</svg>