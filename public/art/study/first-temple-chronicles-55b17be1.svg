<text x="760" y="920" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Each storey 5 high</text>
<text x="760" y="985" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Outer face vertical</text>
<text x="760" y="1050" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Beams rest on ledges</text>
<line x1="80" y1="1200" x2="1520" y2="1200" stroke="#c9c5b9" stroke-width="3"/>
<text x="80" y="1250" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Chronicles 3:8 gives oracle length/breadth 20; height 20 comes</text>
<text x="80" y="1304" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">from Kings 6:20. House plan 60 x 20; annex inset is a Kings</text>
<text x="80" y="1358" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">comparison.</text>
<text x="80" y="1428" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Inventory:10 lampstands,5 per side; 10 tables,5 per side</text>
<text x="80" y="1482" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">(Chronicles 4:8). One gold incense altar; symbols/spacing</text>
<text x="80" y="1536" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">schematic.</text>
<text x="80" y="1606" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Kings 6:31-32 specifies olivewood entering doors. Chronicles</text>
<text x="80" y="1660" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">describes both a veil(3:14) and doors(4:22). Material details and</text>
<text x="80" y="1714" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">source differences remain explicit.</text>
<text x="80" y="1784" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Porch plan 20 across×10 projecting follows Kings 6:3; Kings gives</text>
<text x="80" y="1838" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">no separate porch height. Chronicles 3:4 KJV 120 is shown in the</text>
<text x="80" y="1892" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">dedicated variant study.</text>
<text x="80" y="1962" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">Chronicles elsewhere uses singular table (13:11;29:18); retain</text>
<text x="80" y="2016" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">this textual distinction instead of silently reducing 4:8 ten-</text>
<text x="80" y="2070" fill="#243c38" font-family="Arial,sans-serif" font-size="40" text-anchor="start">table inventory.</text>
</svg>